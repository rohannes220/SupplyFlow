# Render Blueprint: the SupplyFlow API (Node web service). The database is hosted on Neon, not
# Render, so this blueprint creates no database; set DATABASE_URL by hand to Neon's pooled
# connection string. The service builds from the repository root because the backend imports
# shared/ (the @supplyflow/shared workspace package). Only the backend and its workspace
# dependencies are installed. See docs/DEPLOYMENT.md.
services:
  - type: web
    name: supplyflow-api
    runtime: node
    plan: free
    # Install only supplyflow-backend's runtime dependencies and the workspace packages it uses
    # (shared/). pnpm runs via npx so its version matches local development and the lockfile.
    buildCommand: npx --yes pnpm@12.18.0 install --frozen-lockfile --prod --filter supplyflow-backend...
    startCommand: node backend/server.js
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: '20'
      # Neon pooled connection string (host contains "-pooler"). Render asks for it on first
      # deploy; it is never stored in this file.
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
