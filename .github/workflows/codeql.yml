# CodeQL static analysis for security issues in the JavaScript code (backend, frontend, shared).
# Results appear under the repository's Security → Code scanning tab and on pull requests.
name: CodeQL

on:
  pull_request:
  push:
    branches: [master]
  schedule:
    # Weekly, Mondays 06:17 UTC, to pick up newly published queries.
    - cron: '17 6 * * 1'

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  analyze:
    name: Analyze (javascript-typescript)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          # JavaScript needs no build; CodeQL reads the source directly.
          build-mode: none
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
